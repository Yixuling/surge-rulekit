name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 与本机 mise 管理的 Bun 保持一致，升级本机后同步改这里
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      # 用 private.example/ 渲染模板并检查顺序约束；surge-cli 语法校验只能在本地 deploy 时做
      - run: bun test
