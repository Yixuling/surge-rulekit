# surge-rulekit 公开配置：双机场，合并成一条订阅
# 由 https://github.com/Yixuling/surge-rulekit 的模板生成，用法见仓库 README
# 需要改的只有标着 👇 的几行，规则集会跟着仓库自动更新

# ========================================
# Surge 配置
# ========================================
#
# 采用两层路由架构：
#   L1 每家机场每个地区一个 Smart 组，按正则筛选节点并智能选路
#   L2 通过 fallback 将多机场聚合为统一出口
#
# 📚 参考文档：
#   - 官方手册：https://manual.nssurge.com/
#   - 理解原理：https://manual.nssurge.com/book/understanding-surge/cn/
#   - 帮助中心：https://nssurge.zendesk.com/
#   - 技术社区：https://community.nssurge.com
#
# ========================================

[General]
# 日志级别（verbose 影响性能）
loglevel = notify

# 连接状态检测 URL
internet-test-url = http://www.qualcomm.cn/generate_204
# 节点测速 URL
proxy-test-url    = http://cp.cloudflare.com/generate_204
# 节点 UDP 可用性测试（经节点向该 IP 的 53 端口发一次 UDP 查询）；Apple 私有云计算走 UDP 443，udp-policy-not-supported-behaviour 依赖测试结果判断节点是否支持 UDP
proxy-test-udp    = apple.com@8.8.8.8
# 测速超时（秒）
test-timeout      = 5

# 关闭 IPv6（国内支持不稳定）
ipv6     = false
ipv6-vif = off

# REJECT 返回错误页便于排查
show-error-page-for-reject = true

# ── DNS ──
# 明文上游 DNS：配置了加密 DNS 时只用于解析加密 DNS 服务器自身的域名与连通性测试；某网络在 [SSID Setting] 关闭加密 DNS 后才用于普通查询（system 即运营商 DNS，国内 CDN 调度最准）
dns-server                         = system, 119.29.29.29, 223.5.5.5
# 加密 DNS：全局默认开启，防公共 Wi-Fi、蜂窝等不可信网络劫持；只用 DoH（官方推荐，DoQ 走非 53 端口 UDP 易被 QoS），上游并发查询取最快
# 仅作用于本地解析腿，代理流量在出口远程解析、不经此处
encrypted-dns-server               = https://223.5.5.5/dns-query, https://doh.pub/dns-query
# 读取系统 hosts
read-etc-hosts                     = true
# 代理请求不用 [Host] 静态映射（代理端自行解析）
use-local-host-item-for-proxy      = false
# 加密 DNS 不跟随出站策略，走本地解析
encrypted-dns-follow-outbound-mode = false
# 劫持所有 53 端口明文 DNS 查询，防应用硬编码 DNS 绕过 Surge
hijack-dns                         = *:53
# 跳过无点主机名（如 localhost）
exclude-simple-hostnames           = true
# 直连绕过：私有/保留网段、本地域名、系统检测域名
skip-proxy                         = localhost, *.local, *.localdomain, captive.apple.com, sequoia.apple.com, seed-sequoia.siri.apple.com, *.home.arpa, injections.adguard.org, local.adguard.org, 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
# UDP 无法转发时拒绝，防 IP 泄露（WebRTC）
udp-policy-not-supported-behaviour = reject
# 跳过 fake-ip 返回真实 IP（APNs/captive/NTP/STUN 依赖）；勿加 *.apple.com 等宽条目，否则需代理的 Apple 域名会变裸 IP 连接、被 17.0.0.0/8 规则抢成直连
always-real-ip                     = *.lan, *.home.arpa, router.asus.com, *.msftconnecttest.com, *.msftncsi.com, *.push-apple.com.akadns.net, *.push.apple.com, captive.apple.com, *.ntp.org, time.*.com, time.*.apple.com, time1.cloud.tencent.com, time.*.aliyun.com, ntp.*.com, *.time.edu.cn, *.ntp.org.cn, time.windows.com, stun.*.*, *.icloud.com.cn

# ── 网络优化 ──
# 弱 Wi-Fi 自动切蜂窝
wifi-assist  = true
# Wi-Fi+蜂窝 混合（关以省流量）
all-hybrid   = false
# UDP 优先级（游戏优化）
udp-priority = false
# 仅阻断代理策略的 QUIC（直连 HTTP/3 放行）；UDP 绕代理泄漏由 udp-policy-not-supported-behaviour 兜底
block-quic   = per-policy

# ── 监听 ──
# HTTP 代理端口
http-listen            = 127.0.0.1:6152
# SOCKS5 端口
socks5-listen          = 127.0.0.1:6153
# 禁止局域网设备接入
allow-wifi-access      = false
allow-hotspot-access   = false

# ── GeoIP ──
# 无 GEOIP 规则（已用 ASN 分流），库仅供 Dashboard 展示，关闭自动更新
disable-geoip-db-auto-update = true

[Proxy]
🎯 Direct = direct
⛔️ Reject = reject

[Proxy Group]
# ── 核心出口 ──
# 主代理入口（自动选路，可手动切换）
🚀 Proxy = select, "🌀 💫 Auto", include-other-group = "📍 Regions, 📡 Subscription", category = 🧭 Core
# 全局兜底（dns-failed 也走此组）
🟢 Final = select, "🚀 Proxy", "🎯 Direct", category = 🧭 Core
# 广告/追踪策略（Guard.list 启用中，选直连可临时放行）
🔰 Guard = select, "⛔️ Reject", "🎯 Direct", category = 🧭 Core

# ── 服务分流 ──
# 各服务独立选择：代理 / 直连 / 地区
AdsPower  = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/AdsPower.png
Apple     =select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Apple.png
AI        = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/AI.png
Arc & Dia = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/ArcDia.png
DeepL     = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/DeepL.png
Disney    = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Disney.png
GitHub    = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/GitHub.png
Google    = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Google.png
JetBrains = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/JetBrains.png
Netflix   = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Netflix.png
PayPal    = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/PayPal.png
Twitter   = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Twitter.png
Telegram  = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Telegram.png
Speedtest = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Speedtest.png
WeChat    = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/WeChat.png
YouTube   = select, "🚀 Proxy", "🎯 Direct", include-other-group = "📍 Regions, 📡 Subscription", category = 🧩 Services, icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/YouTube.png

# 命名规则（均为 hidden，仅配置文件内可见）：
#   L1  全名     🇭🇰 HongKong | 机场A    Smart 引擎（smart · 按地区正则筛选节点并智能选路）
#   L2  🌀 前缀  🌀 🇭🇰 HongKong             可见路由（fallback · 主优先冷备）

# ── L1 Smart 引擎 ──
# 从机场子集按地区正则筛选节点，按历史延迟/成功率选路
# 两字母缩写用 (?<![A-Z])..(?![A-Z]) 限定为独立词，否则 US 会命中 RUS/AUS、HK 会命中 HKT 之类
# 主力机场
💫 Auto | 机场A      = smart, hidden = 1, include-other-group = 机场A, policy-regex-filter = (HongKong|香港|(?<![A-Z])HK(?![A-Z])|🇭🇰|Singapore|新加坡|(?<![A-Z])SG(?![A-Z])|🇸🇬)
🇭🇰 HongKong | 机场A  = smart, hidden = 1, include-other-group = 机场A, policy-regex-filter = (HongKong|香港|(?<![A-Z])HK(?![A-Z])|🇭🇰)
🇸🇬 Singapore | 机场A = smart, hidden = 1, include-other-group = 机场A, policy-regex-filter = (Singapore|新加坡|(?<![A-Z])SG(?![A-Z])|🇸🇬)
🇺🇸 USA | 机场A       = smart, hidden = 1, include-other-group = 机场A, policy-regex-filter = (United States|美国|(?<![A-Z])USA?(?![A-Z])|🇺🇸)
🇯🇵 Japan | 机场A     = smart, hidden = 1, include-other-group = 机场A, policy-regex-filter = (Japan|日本|(?<![A-Z])JP(?![A-Z])|🇯🇵)
🇼🇸 Taiwan | 机场A    = smart, hidden = 1, include-other-group = 机场A, policy-regex-filter = (Taiwan|台湾|(?<![A-Z])TW(?![A-Z])|🇹🇼|🇼🇸)
# 备用机场
💫 Auto | 机场B       = smart, hidden = 1, include-other-group = 机场B, policy-regex-filter = HongKong|香港|(?<![A-Z])HK(?![A-Z])|🇭🇰|Singapore|新加坡|(?<![A-Z])SG(?![A-Z])|🇸🇬
🇭🇰 HongKong | 机场B   = smart, hidden = 1, include-other-group = 机场B, policy-regex-filter = HongKong|香港|(?<![A-Z])HK(?![A-Z])|🇭🇰
🇸🇬 Singapore | 机场B  = smart, hidden = 1, include-other-group = 机场B, policy-regex-filter = Singapore|新加坡|(?<![A-Z])SG(?![A-Z])|🇸🇬
🇺🇸 USA | 机场B        = smart, hidden = 1, include-other-group = 机场B, policy-regex-filter = United States|美国|(?<![A-Z])USA?(?![A-Z])|🇺🇸
🇯🇵 Japan | 机场B      = smart, hidden = 1, include-other-group = 机场B, policy-regex-filter = Japan|日本|(?<![A-Z])JP(?![A-Z])|🇯🇵
🇼🇸 Taiwan | 机场B     = smart, hidden = 1, include-other-group = 机场B, policy-regex-filter = Taiwan|台湾|(?<![A-Z])TW(?![A-Z])|🇹🇼|🇼🇸

# ── L2 可见路由 ──
# 对外地区出口；fallback 主机场优先、备用冷备，故障自动切换/回切
🌀 💫 Auto      = fallback, "💫 Auto | 机场A",      "💫 Auto | 机场B",      url = http://cp.cloudflare.com/generate_204, interval = 300, category = 🌏 Regions
🌀 🇭🇰 HongKong  = fallback, "🇭🇰 HongKong | 机场A",  "🇭🇰 HongKong | 机场B",  url = http://cp.cloudflare.com/generate_204, interval = 300, category = 🌏 Regions
🌀 🇸🇬 Singapore = fallback, "🇸🇬 Singapore | 机场A", "🇸🇬 Singapore | 机场B", url = http://cp.cloudflare.com/generate_204, interval = 300, category = 🌏 Regions
🌀 🇺🇸 USA       = fallback, "🇺🇸 USA | 机场A",       "🇺🇸 USA | 机场B",       url = http://cp.cloudflare.com/generate_204, interval = 300, category = 🌏 Regions
🌀 🇯🇵 Japan     = fallback, "🇯🇵 Japan | 机场A",     "🇯🇵 Japan | 机场B",     url = http://cp.cloudflare.com/generate_204, interval = 300, category = 🌏 Regions
🌀 🇼🇸 Taiwan    = fallback, "🇼🇸 Taiwan | 机场A",    "🇼🇸 Taiwan | 机场B",    url = http://cp.cloudflare.com/generate_204, interval = 300, category = 🌏 Regions

# ── 订阅源 ──
# 全量节点池（远程订阅）
# 👇 换成合并后的订阅链接（两家机场的订阅可以用 Sub-Store 合并成一份）
📡 Subscription            = select, hidden = 1, policy-path = https://example.com/merged-subscription
# 机场子集（正则过滤）
# 👇 关键词A、关键词B 换成节点名里能区分两家机场的关键词
机场A = select, include-other-group = "📡 Subscription", policy-regex-filter = 关键词A, category = 📶 Nodes, icon-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png
机场B  = select, include-other-group = "📡 Subscription", policy-regex-filter = 关键词B, category = 📶 Nodes, icon-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Airport.png

# ── 工具 ──
# 地区快速切换（聚合 L2）
📍 Regions = select, hidden = 1, "🌀 🇭🇰 HongKong", "🌀 🇸🇬 Singapore", "🌀 🇺🇸 USA", "🌀 🇯🇵 Japan", "🌀 🇼🇸 Taiwan"

[Rule]
# 拦截 0.0.0.0 无效请求
IP-CIDR, 0.0.0.0/32, REJECT, no-resolve

# ── AdsPower ──
# 按进程整体分流（仅 Surge Mac，iOS 忽略进程规则）：客户端本体 + SunBrowser 内核（网页请求由其 Helper 子进程发出，须通配）
# 置于拦截之前：环境内全部流量走同一出口，不受本机拦截影响
PROCESS-NAME, AdsPower Global*, AdsPower
PROCESS-NAME, SunBrowser*,      AdsPower

# ── 广告与追踪 ──
# 置顶：拦截先于一切分流，追踪域名不能先被其他规则集命中而放行（Guard.list 不含微信域名，不影响微信优先）
# Guard.list：作者本机实测的纯追踪，拦了不影响功能；默认 ⛔️ Reject，误拦时把 🔰 Guard 组切到直连即可整体放行排查
RULE-SET, https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/rules/Guard.list, 🔰 Guard
# 以下上游列表仅供参考，作者不启用。它们的主体在 *_Domain.list（DOMAIN-SET，约 28 万 + 4 万条），这里只引用规则部分（约 800 条）。
# 没引用大列表：配置与 iOS 共用，几十万条常驻会挤占网络扩展内存；隐私列表误拦多（登录、支付、崩溃上报依赖的统计服务也在其中）；网页广告已有 AdGuard
# 想让 REJECT 在 DNS 应答阶段生效可加 pre-matching，但它要求策略直接是 REJECT 类，不能指向 🔰 Guard 这种 select 组（surge-cli 会报 non-reject policy）
# RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Advertising/Advertising.list, 🔰 Guard
# RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Privacy/Privacy.list, 🔰 Guard
# RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Hijacking/Hijacking.list, 🔰 Guard

# ── 微信 ──
# 紧随拦截之后、先于其余规则集匹配（微信对出口策略敏感）
RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/WeChat/WeChat.list, WeChat, extended-matching

# ── Apple ──
# Apple Intelligence（需代理）
RULE-SET, https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/rules/AppleIntelligence.list, Apple, extended-matching
# 自维护补充（gateway 账户 API + AppleMedia 未含的媒体边缘域）；须在下方直连规则前
RULE-SET, https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/rules/AppleExtra.list, Apple, extended-matching
# App Store / iCloud 直连更快
RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/AppStore/AppStore.list, DIRECT
