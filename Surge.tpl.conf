# Surge 配置模板，不能直接加载：bun run render 用 private/ 填充后输出 dist/Surge.conf
#   {{变量名}}     替换为 private/values.env 中的同名变量
#   {{> 片段名}}   内联 private/snippets/片段名.conf（独占一行）
# 本段只描述模板，渲染时会被替换为生成说明

# ========================================
# Surge 配置
# ========================================
#
# 采用两层路由架构：
#   L1 每家机场每个地区一个 Smart 组，按正则筛选节点并智能选路
#   L2 通过 fallback 将多机场聚合为统一出口
#
# 📚 参考文档：
#   - 官方手册：https://manual.nssurge.com/
#   - 理解原理：https://manual.nssurge.com/book/understanding-surge/cn/
#   - 帮助中心：https://nssurge.zendesk.com/
#   - 技术社区：https://community.nssurge.com
#
# ========================================

[General]
# 日志级别（verbose 影响性能）
loglevel = notify

# 连接状态检测 URL
internet-test-url = http://www.qualcomm.cn/generate_204
# 节点测速 URL
proxy-test-url    = http://cp.cloudflare.com/generate_204
# 节点 UDP 可用性测试（经节点向该 IP 的 53 端口发一次 UDP 查询）；Apple 私有云计算走 UDP 443，udp-policy-not-supported-behaviour 依赖测试结果判断节点是否支持 UDP
proxy-test-udp    = apple.com@8.8.8.8
# 测速超时（秒）
test-timeout      = 5

# 关闭 IPv6（国内支持不稳定）
ipv6     = false
ipv6-vif = off

# REJECT 返回错误页便于排查
show-error-page-for-reject = true

# ── DNS ──
# 明文上游 DNS：只用于解析下方加密 DNS 服务器自身的域名与连通性测试，其余域名一律走加密 DNS
dns-server                         = 119.29.29.29, 223.5.5.5
# 加密 DNS：DoQ 为主、DoH 为备，所有上游并发查询取最快；仅作用于本地解析腿（防劫持），代理流量在出口远程解析、不经此处
encrypted-dns-server               = quic://223.5.5.5, https://223.5.5.5/dns-query, https://doh.pub/dns-query
# 读取系统 hosts
read-etc-hosts                     = true
# 代理请求不用 [Host] 静态映射（代理端自行解析）
use-local-host-item-for-proxy      = false
# 加密 DNS 不跟随出站策略，走本地解析
encrypted-dns-follow-outbound-mode = false
# 劫持所有 53 端口明文 DNS 查询，防应用硬编码 DNS 绕过 Surge
hijack-dns                         = *:53
# 跳过无点主机名（如 localhost）
exclude-simple-hostnames           = true
# 直连绕过：私有/保留网段、本地域名、系统检测域名；末尾为私有追加条目（反代理检测的银行 App 等，见 values.env）
skip-proxy                         = localhost, *.local, *.localdomain, captive.apple.com, sequoia.apple.com, seed-sequoia.siri.apple.com, *.home.arpa, injections.adguard.org, local.adguard.org, 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32, {{SKIP_PROXY_EXTRA}}
# UDP 无法转发时拒绝，防 IP 泄露（WebRTC）
udp-policy-not-supported-behaviour = reject
# 跳过 fake-ip 返回真实 IP（APNs/captive/NTP/STUN 依赖）；勿加 *.apple.com 等宽条目，否则需代理的 Apple 域名会变裸 IP 连接、被 17.0.0.0/8 规则抢成直连
always-real-ip                     = *.lan, *.home.arpa, router.asus.com, *.msftconnecttest.com, *.msftncsi.com, *.push-apple.com.akadns.net, *.push.apple.com, captive.apple.com, *.ntp.org, time.*.com, time.*.apple.com, time1.cloud.tencent.com, time.*.aliyun.com, ntp.*.com, *.time.edu.cn, *.ntp.org.cn, time.windows.com, stun.*.*, *.icloud.com.cn

# ── 网络优化 ──
# 弱 Wi-Fi 自动切蜂窝
wifi-assist  = true
# Wi-Fi+蜂窝 混合（关以省流量）
all-hybrid   = false
# UDP 优先级（游戏优化）
udp-priority = false
# 仅阻断代理策略的 QUIC（直连 HTTP/3 放行）；UDP 绕代理泄漏由 udp-policy-not-supported-behaviour 兜底
block-quic   = per-policy

# ── 监听 ──
# HTTP 代理端口
http-listen            = 127.0.0.1:6152
# SOCKS5 端口
socks5-listen          = 127.0.0.1:6153
# 禁止局域网设备接入
allow-wifi-access      = false
allow-hotspot-access   = false
# HTTP API（Dashboard/外部调用，仅本地）
http-api               = {{HTTP_API_KEY}}@127.0.0.1:6154
http-api-tls           = false
http-api-web-dashboard = true

# ── GeoIP ──
# 无 GEOIP 规则（已用 ASN 分流），库仅供 Dashboard 展示，关闭自动更新
disable-geoip-db-auto-update = true

[Proxy]
🎯 Direct = direct
⛔️ Reject = reject

[Proxy Group]
# ── 核心出口 ──
# 主代理入口（自动选路，可手动切换）
🚀 Proxy = select, "🌀 💫 Auto", include-other-group = "📍 Regions, 📡 Subscription"
# 全局兜底（dns-failed 也走此组）
🟢 Final = select, "🚀 Proxy", "🎯 Direct"
# 广告/隐私策略（规则集已停用，AdGuard 接管）
🔰 Guard = select, "⛔️ Reject", "🎯 Direct"

# ── 服务分流 ──
# 各服务独立选择：代理 / 直连 / 专线 / 地区
Apple     = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Apple.png
AI        = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/AI.png
Arc & Dia = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/ArcDia.png
DeepL     = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/DeepL.png
Disney    = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Disney.png
GitHub    = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/GitHub.png
Google    = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Google.png
JetBrains = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/JetBrains.png
Netflix   = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Netflix.png
PayPal    = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/PayPal.png
Twitter   = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Twitter.png
Telegram  = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Telegram.png
Speedtest = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/Speedtest.png
WeChat    = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/WeChat.png
YouTube   = select, "🚀 Proxy", "🎯 Direct", "🚄 Static", include-other-group = "📍 Regions, 📡 Subscription", icon-url = https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/icons/YouTube.png

# 命名规则（均为 hidden，仅配置文件内可见）：
#   L1  全名     🇭🇰 HongKong | {{SECRET_PRIMARY_AIRPORT}}    Smart 引擎（smart · 按地区正则筛选节点并智能选路）
#   L2  🌀 前缀  🌀 🇭🇰 HongKong             可见路由（fallback · 主优先冷备）

# ── L1 Smart 引擎 ──
# 从机场子集按地区正则筛选节点，按历史延迟/成功率选路
# 两字母缩写用 (?<![A-Z])..(?![A-Z]) 限定为独立词，否则 US 会命中 RUS/AUS、HK 会命中 HKT 之类
# 主力机场（排除专线节点）
💫 Auto | {{SECRET_PRIMARY_AIRPORT}}      = smart, hidden = 1, include-other-group = {{SECRET_PRIMARY_AIRPORT}}, policy-regex-filter = ^(?!.*{{SECRET_STATIC_KEYWORD}}).*(HongKong|香港|(?<![A-Z])HK(?![A-Z])|🇭🇰|Singapore|新加坡|(?<![A-Z])SG(?![A-Z])|🇸🇬)
🇭🇰 HongKong | {{SECRET_PRIMARY_AIRPORT}}  = smart, hidden = 1, include-other-group = {{SECRET_PRIMARY_AIRPORT}}, policy-regex-filter = ^(?!.*{{SECRET_STATIC_KEYWORD}}).*(HongKong|香港|(?<![A-Z])HK(?![A-Z])|🇭🇰)
🇸🇬 Singapore | {{SECRET_PRIMARY_AIRPORT}} = smart, hidden = 1, include-other-group = {{SECRET_PRIMARY_AIRPORT}}, policy-regex-filter = ^(?!.*{{SECRET_STATIC_KEYWORD}}).*(Singapore|新加坡|(?<![A-Z])SG(?![A-Z])|🇸🇬)
🇺🇸 USA | {{SECRET_PRIMARY_AIRPORT}}       = smart, hidden = 1, include-other-group = {{SECRET_PRIMARY_AIRPORT}}, policy-regex-filter = ^(?!.*{{SECRET_STATIC_KEYWORD}}).*(United States|美国|(?<![A-Z])USA?(?![A-Z])|🇺🇸)
🇯🇵 Japan | {{SECRET_PRIMARY_AIRPORT}}     = smart, hidden = 1, include-other-group = {{SECRET_PRIMARY_AIRPORT}}, policy-regex-filter = ^(?!.*{{SECRET_STATIC_KEYWORD}}).*(Japan|日本|(?<![A-Z])JP(?![A-Z])|🇯🇵)
🇼🇸 Taiwan | {{SECRET_PRIMARY_AIRPORT}}    = smart, hidden = 1, include-other-group = {{SECRET_PRIMARY_AIRPORT}}, policy-regex-filter = ^(?!.*{{SECRET_STATIC_KEYWORD}}).*(Taiwan|台湾|(?<![A-Z])TW(?![A-Z])|🇹🇼|🇼🇸)
# 备用机场
💫 Auto | {{SECRET_BACKUP_AIRPORT}}       = smart, hidden = 1, include-other-group = {{SECRET_BACKUP_AIRPORT}}, policy-regex-filter = HongKong|香港|(?<![A-Z])HK(?![A-Z])|🇭🇰|Singapore|新加坡|(?<![A-Z])SG(?![A-Z])|🇸🇬
🇭🇰 HongKong | {{SECRET_BACKUP_AIRPORT}}   = smart, hidden = 1, include-other-group = {{SECRET_BACKUP_AIRPORT}}, policy-regex-filter = HongKong|香港|(?<![A-Z])HK(?![A-Z])|🇭🇰
🇸🇬 Singapore | {{SECRET_BACKUP_AIRPORT}}  = smart, hidden = 1, include-other-group = {{SECRET_BACKUP_AIRPORT}}, policy-regex-filter = Singapore|新加坡|(?<![A-Z])SG(?![A-Z])|🇸🇬
🇺🇸 USA | {{SECRET_BACKUP_AIRPORT}}        = smart, hidden = 1, include-other-group = {{SECRET_BACKUP_AIRPORT}}, policy-regex-filter = United States|美国|(?<![A-Z])USA?(?![A-Z])|🇺🇸
🇯🇵 Japan | {{SECRET_BACKUP_AIRPORT}}      = smart, hidden = 1, include-other-group = {{SECRET_BACKUP_AIRPORT}}, policy-regex-filter = Japan|日本|(?<![A-Z])JP(?![A-Z])|🇯🇵
🇼🇸 Taiwan | {{SECRET_BACKUP_AIRPORT}}     = smart, hidden = 1, include-other-group = {{SECRET_BACKUP_AIRPORT}}, policy-regex-filter = Taiwan|台湾|(?<![A-Z])TW(?![A-Z])|🇹🇼|🇼🇸

# ── L2 可见路由 ──
# 对外地区出口；fallback 主机场优先、备用冷备，故障自动切换/回切
🌀 💫 Auto      = fallback, "💫 Auto | {{SECRET_PRIMARY_AIRPORT}}",      "💫 Auto | {{SECRET_BACKUP_AIRPORT}}",      url = http://cp.cloudflare.com/generate_204, interval = 300
🌀 🇭🇰 HongKong  = fallback, "🇭🇰 HongKong | {{SECRET_PRIMARY_AIRPORT}}",  "🇭🇰 HongKong | {{SECRET_BACKUP_AIRPORT}}",  url = http://cp.cloudflare.com/generate_204, interval = 300
🌀 🇸🇬 Singapore = fallback, "🇸🇬 Singapore | {{SECRET_PRIMARY_AIRPORT}}", "🇸🇬 Singapore | {{SECRET_BACKUP_AIRPORT}}", url = http://cp.cloudflare.com/generate_204, interval = 300
🌀 🇺🇸 USA       = fallback, "🇺🇸 USA | {{SECRET_PRIMARY_AIRPORT}}",       "🇺🇸 USA | {{SECRET_BACKUP_AIRPORT}}",       url = http://cp.cloudflare.com/generate_204, interval = 300
🌀 🇯🇵 Japan     = fallback, "🇯🇵 Japan | {{SECRET_PRIMARY_AIRPORT}}",     "🇯🇵 Japan | {{SECRET_BACKUP_AIRPORT}}",     url = http://cp.cloudflare.com/generate_204, interval = 300
🌀 🇼🇸 Taiwan    = fallback, "🇼🇸 Taiwan | {{SECRET_PRIMARY_AIRPORT}}",    "🇼🇸 Taiwan | {{SECRET_BACKUP_AIRPORT}}",    url = http://cp.cloudflare.com/generate_204, interval = 300

# ── 专线 ──
# 专线（独享 IP 等特殊节点，按 SECRET_STATIC_KEYWORD 标识筛出），独立于普通池
🚄 Static = select, include-other-group = {{SECRET_PRIMARY_AIRPORT}}, policy-regex-filter = {{SECRET_STATIC_KEYWORD}}

# ── 订阅源 ──
# 全量节点池（远程订阅）
📡 Subscription            = select, hidden = 1, policy-path = {{SECRET_SUB_URL}}
# 机场子集（正则过滤）
{{SECRET_PRIMARY_AIRPORT}} = select, include-other-group = "📡 Subscription", policy-regex-filter = {{SECRET_PRIMARY_AIRPORT}}, icon-url = {{PRIMARY_AIRPORT_ICON}}
{{SECRET_BACKUP_AIRPORT}}  = select, include-other-group = "📡 Subscription", policy-regex-filter = {{SECRET_BACKUP_AIRPORT}},  icon-url = {{BACKUP_AIRPORT_ICON}}

# ── 工具 ──
# 地区快速切换（聚合 L2）
📍 Regions = select, hidden = 1, "🌀 🇭🇰 HongKong", "🌀 🇸🇬 Singapore", "🌀 🇺🇸 USA", "🌀 🇯🇵 Japan", "🌀 🇼🇸 Taiwan"

[Rule]
# 拦截 0.0.0.0 无效请求
IP-CIDR, 0.0.0.0/32, REJECT, no-resolve

{{> private-rules}}

# 广告/隐私/劫持：已由 AdGuard 内容层（HTTPS 过滤）接管，以下停用
# 重新启用时可加 pre-matching 让 REJECT 在 DNS 应答阶段生效、连接不建立，但 surge-cli 校验要求该参数后面必须直接是 REJECT 类策略，
# 指向 🔰 Guard 这种 select 组会报「marked with pre-matching but follows a non-reject policy」；要用就把策略改写成 REJECT 并放弃 Guard 组开关
# RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Advertising/Advertising.list, 🔰 Guard
# RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Privacy/Privacy.list, 🔰 Guard
# RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Hijacking/Hijacking.list, 🔰 Guard

# ── 微信 ──
# 置顶优先匹配（微信对策略敏感）
RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/WeChat/WeChat.list, WeChat, extended-matching

# ── Apple ──
# Apple Intelligence（需代理）
RULE-SET, https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/rules/AppleIntelligence.list, Apple, extended-matching
# 自维护补充（gateway 账户 API + AppleMedia 未含的媒体边缘域）；须在下方直连规则前
RULE-SET, https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/rules/AppleExtra.list, Apple, extended-matching
# App Store / iCloud 直连更快
RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/AppStore/AppStore.list, DIRECT
# 自维护补充（购买 API、安装包与系统更新 CDN、证书校验、商店基础 API：都解析到国内 CDN，不点名会被 Global 的 apple.com 后缀送进代理）
RULE-SET, https://raw.githubusercontent.com/Yixuling/surge-rulekit/refs/heads/main/rules/AppleDirect.list, DIRECT
RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/iCloud/iCloud.list, DIRECT
# 需代理的 Apple 服务
RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/AppleDev/AppleDev.list, Apple, extended-matching
RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/TestFlight/TestFlight.list, Apple, extended-matching
RULE-SET, https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/AppleMedia/AppleMedia.list, Apple, extended-matching
# Apple 网段裸 IP 流量（APNs/FaceTime）兜底直连；须在 Apple 域名规则后，apple-relay 等需代理域名也在 17.x，前置会被抢成直连
IP-CIDR, 17.0.0.0/8, DIRECT, no-resolve

